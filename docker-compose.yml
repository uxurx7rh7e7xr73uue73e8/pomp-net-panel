version: '3.9'

services:
  pompnet-panel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XUI_VERSION: v3.8.5
    container_name: pompnet-panel
    restart: unless-stopped
    ports:
      - "${XUI_PORT:-8080}:8080"
      - "${XUI_SUBSCRIPTION_PORT:-2026}:2026"
      # Add Xray inbound ports as needed:
      # - "443:443"
      # - "80:80"
    environment:
      # Panel Configuration
      XUI_PORT: ${XUI_PORT:-8080}
      XUI_SUBSCRIPTION_PORT: ${XUI_SUBSCRIPTION_PORT:-2026}
      XUI_DB_FOLDER: ${XUI_DB_FOLDER:-/app/data}
      XUI_DB_TYPE: ${XUI_DB_TYPE:-sqlite}
      XUI_INIT_WEB_BASE_PATH: ${XUI_INIT_WEB_BASE_PATH:-/}
      XUI_LOG_LEVEL: ${XUI_LOG_LEVEL:-info}
      XUI_DEBUG: ${XUI_DEBUG:-false}
      XUI_ENABLE_FAIL2BAN: ${XUI_ENABLE_FAIL2BAN:-true}
      
      # Render compatibility - automatically uses PORT if provided
      PORT: ${PORT:-}
      
      # Official Sanaei settings
      XUI_IN_DOCKER: "true"
      XUI_MAIN_FOLDER: "/app"
      TZ: "Asia/Tehran"
    
    volumes:
      - pompnet-data:/app/data
    
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - pompnet-network
    
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  pompnet-data:
    driver: local

networks:
  pompnet-network:
    driver: bridge
